apiVersion: v1
kind: Service
metadata:
  name: nas-postgres
  namespace: nas-services
spec:
  clusterIP: None
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: nas-postgres
  namespace: nas-services
subsets:
  - addresses:
      - ip: 192.168.0.180
    ports:
      - port: 5432
---
