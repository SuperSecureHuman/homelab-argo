apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spegel
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: oci://ghcr.io/spegel-org/helm-charts
      chart: spegel
      targetRevision: 0.7.0
      helm:
        valueFiles:
          - $values/values/spegel/values.yaml
    - repoURL: "https://github.com/SuperSecureHuman/homelab-argo.git"
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: spegel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
