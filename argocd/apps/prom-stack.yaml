apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prom-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 87.2.1
      helm:
        valueFiles:
          - $values/values/prom-stack/values.yaml
          - $values/values/prom-stack/scrape-configs.yaml
    - repoURL: "https://github.com/SuperSecureHuman/homelab-argo.git"
      targetRevision: main
      ref: values
    - repoURL: "https://github.com/SuperSecureHuman/homelab-argo.git"
      targetRevision: main
      path: manifests/prom-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    # Helm always renders this secret; admin-password is manually managed
    - group: ""
      kind: Secret
      name: prom-stack-grafana
      namespace: monitoring
      jsonPointers:
        - /data/admin-password
    # Cascades from secret drift above
    - group: apps
      kind: StatefulSet
      name: prom-stack-grafana
      namespace: monitoring
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
    # ESO runtime-injected fields — explicit paths until ArgoCD upgraded for ServerSideDiff+managedFieldsManagers
    - group: external-secrets.io
      kind: ExternalSecret
      namespace: monitoring
      jsonPointers:
        - /metadata/finalizers
        - /spec/data/0/remoteRef/conversionStrategy
        - /spec/data/0/remoteRef/decodingStrategy
        - /spec/data/0/remoteRef/metadataPolicy
        - /spec/data/0/remoteRef/nullBytePolicy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
