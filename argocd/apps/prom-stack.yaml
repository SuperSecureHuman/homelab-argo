apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prom-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 84.5.0
      helm:
        valueFiles:
          - $values/values/prom-stack/values.yaml
          - $values/values/prom-stack/scrape-configs.yaml
    - repoURL: "https://github.com/SuperSecureHuman/homelab-argo.git"
      targetRevision: main
      ref: values
    - repoURL: "https://github.com/SuperSecureHuman/homelab-argo.git"
      targetRevision: main
      path: manifests/prom-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
