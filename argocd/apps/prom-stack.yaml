apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prom-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 87.2.1
      helm:
        valueFiles:
          - $values/values/prom-stack/values.yaml
          - $values/values/prom-stack/scrape-configs.yaml
    - repoURL: "https://github.com/SuperSecureHuman/homelab-argo.git"
      targetRevision: main
      ref: values
    - repoURL: "https://github.com/SuperSecureHuman/homelab-argo.git"
      targetRevision: main
      path: manifests/prom-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    # ESO owns these fields at runtime
    - group: external-secrets.io
      kind: ExternalSecret
      namespace: monitoring
      managedFieldsManagers:
        - external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

