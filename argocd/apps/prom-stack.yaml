apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prom-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 84.5.0
      helm:
        valueFiles:
          - $values/values/prom-stack/values.yaml
          - $values/values/prom-stack/scrape-configs.yaml
    - repoURL: "https://github.com/SuperSecureHuman/homelab-argo.git"
      targetRevision: main
      ref: values
    - repoURL: "https://github.com/SuperSecureHuman/homelab-argo.git"
      targetRevision: main
      path: manifests/prom-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    # Helm always renders this secret; admin-password is manually managed
    - group: ""
      kind: Secret
      name: prom-stack-grafana
      namespace: monitoring
      jsonPointers:
        - /data/admin-password
    # Cascades from secret drift above
    - group: apps
      kind: StatefulSet
      name: prom-stack-grafana
      namespace: monitoring
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
    # ESO owns these fields at runtime — use managedFieldsManagers instead of hardcoded paths
    - group: external-secrets.io
      kind: ExternalSecret
      namespace: monitoring
      managedFieldsManagers:
        - external-secrets
    # status.terminatingReplicas not in ArgoCD's embedded schema (k3s v1.36 / ArgoCD v3.3.9 mismatch)
    - group: apps
      kind: Deployment
      name: prom-stack-kube-state-metrics
      namespace: monitoring
      jsonPointers:
        - /status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

