apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nas-externalsvc
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: "https://github.com/SuperSecureHuman/homelab-argo.git"
      targetRevision: main
      path: manifests/nas-externalsvc
  destination:
    server: https://kubernetes.default.svc
    namespace: nas-services
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
