prometheus:
  prometheusSpec:
    scrapeInterval: 60s
    evaluationInterval: 60s
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    retention: 14d
    retentionSize: 7GB
    additionalScrapeConfigs:
